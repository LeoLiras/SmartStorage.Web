name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build da solution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SmartStorage-API/SmartStorageWeb.sln

      - name: Build
        run: dotnet build SmartStorage-API/SmartStorageWeb.sln -c Release --no-restore

  images:
    name: Build e push das imagens
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Define a tag das imagens
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Gera o .env de build
        run: grep -v '^IMAGE_TAG=' .env.example > .env

      - name: Build das imagens
        run: docker compose build

      - name: Login no Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Push das imagens
        if: github.event_name == 'push'
        run: |
          for image in $(docker compose config --images | grep '^lelep0/'); do
            docker tag "$image" "${image%:*}:latest"
            docker push "$image"
            docker push "${image%:*}:latest"
          done
