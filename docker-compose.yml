# As imagens dotnet/aspnet nao trazem curl nem wget, mas trazem bash, que abre
# conexao TCP pelo /dev/tcp. O printf monta um GET no /health na mao e o grep
# exige o 200 na status line: sem ele o check passaria com um 404, ja que o
# servidor teria respondido do mesmo jeito.
x-dotnet-healthcheck: &dotnet-healthcheck
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
  interval: 30s
  timeout: 5s
  retries: 3
  # Sem o start_interval o primeiro check so aconteceria 30s depois de subir, e
  # cada nivel do depends_on pagaria essa espera antes de liberar o proximo.
  start_period: 20s
  start_interval: 2s

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # Responder no master nao significa que o banco da aplicacao esta usavel:
      # num restart com o volume ja populado o SQL Server aceita conexao antes
      # de terminar a recuperacao do SmartStorageWeb.db, e o migrator, achando
      # que o banco nao existe, tenta um CREATE DATABASE e falha. Por isso o
      # check exige tambem que nenhum banco de usuario (database_id > 4) esteja
      # fora do estado ONLINE. Na primeira subida nao ha banco de usuario algum,
      # a condicao passa direto e o migrator cria o banco normalmente.
      # O -b e obrigatorio: sem ele o sqlcmd sai com codigo 0 mesmo em erro de
      # T-SQL, e o RAISERROR passaria despercebido.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SET NOCOUNT ON; IF EXISTS (SELECT 1 FROM sys.databases WHERE database_id > 4 AND state_desc <> 'ONLINE') RAISERROR('banco de usuario ainda em recuperacao', 16, 1); SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrator:
    image: lelep0/smartstorage-migrator:${IMAGE_TAG:-latest}
    build:
      context: ./SmartStorage-API
      dockerfile: SmartStorage.Infraestructure/Dockerfile
    environment:
      ConnectionStrings__SqlServerConnection: "Server=sqlserver,1433;Database=SmartStorageWeb.db;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;"
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy

  smartstorage-api:
    image: lelep0/smartstorage-api:${IMAGE_TAG:-latest}
    build:
      context: ./SmartStorage-API
      dockerfile: SmartStorage-API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SqlServerConnection: "Server=sqlserver,1433;Database=SmartStorageWeb.db;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      TokenConfigurations__Secret: ${JWT_SECRET}
    ports:
      - "5100:8080"
    healthcheck: *dotnet-healthcheck
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  authenticationapi:
    image: lelep0/smartstorage-authapi:${IMAGE_TAG:-latest}
    build:
      context: ./SmartStorage-API
      dockerfile: SmartStorage.AuthenticationAPI/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SqlServerConnection: "Server=sqlserver,1433;Database=SmartStorageWeb.db;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;"
      TokenConfigurations__Secret: ${JWT_SECRET}
    ports:
      - "5202:8080"
    healthcheck: *dotnet-healthcheck
    depends_on:
      sqlserver:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  emailapi:
    image: lelep0/smartstorage-emailapi:${IMAGE_TAG:-latest}
    build:
      context: ./SmartStorage-API
      dockerfile: SmartStorage.EmailAPI/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SqlServerConnection: "Server=sqlserver,1433;Database=SmartStorageWeb.db;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Email__Username: ${EMAIL_USERNAME}
      Email__Password: ${EMAIL_PASSWORD}
      Email__Destinatario: ${EMAIL_DESTINATARIO}
      TokenConfigurations__Secret: ${JWT_SECRET}
    ports:
      - "5107:8080"
    healthcheck: *dotnet-healthcheck
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  aiapi:
    image: lelep0/smartstorage-aiapi:${IMAGE_TAG:-latest}
    build:
      context: ./SmartStorage-API
      dockerfile: SmartStorage.AIAPI/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SqlServerConnection: "Server=sqlserver,1433;Database=SmartStorageWeb.db;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;"
      TokenConfigurations__Secret: ${JWT_SECRET}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    ports:
      - "5103:8080"
    healthcheck: *dotnet-healthcheck
    depends_on:
      sqlserver:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  reportsapi:
    image: lelep0/smartstorage-reportsapi:${IMAGE_TAG:-latest}
    build:
      context: ./SmartStorage-API
      dockerfile: SmartStorage.ReportsAPI/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SqlServerConnection: "Server=sqlserver,1433;Database=SmartStorageWeb.db;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;"
      TokenConfigurations__Secret: ${JWT_SECRET}
    ports:
      - "5105:8080"
    healthcheck: *dotnet-healthcheck
    depends_on:
      sqlserver:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  apigateway:
    image: lelep0/smartstorage-gateway:${IMAGE_TAG:-latest}
    build:
      context: ./SmartStorage-API
      dockerfile: SmartStorage.APIGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "4480:8080"
    healthcheck: *dotnet-healthcheck
    depends_on:
      authenticationapi:
        condition: service_healthy
      emailapi:
        condition: service_healthy
      aiapi:
        condition: service_healthy
      reportsapi:
        condition: service_healthy

  blazor:
    image: lelep0/smartstorage-blazor:${IMAGE_TAG:-latest}
    build:
      context: ./SmartStorage-API
      dockerfile: SmartStorage.Blazor/Dockerfile
    ports:
      - "5000:8080"
    # A imagem alpine do nginx, ao contrario das de dotnet, ja tem wget.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
      start_interval: 2s
    depends_on:
      apigateway:
        condition: service_healthy

volumes:
  sqlserver-data:
