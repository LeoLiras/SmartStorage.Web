server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Blazor WebAssembly é uma SPA: o roteamento acontece dentro do navegador,
    # não no servidor. Qualquer URL que não corresponda a um arquivo real
    # devolve o index.html, para o app carregar e resolver a rota sozinho.
    # Sem isso, dar F5 em /produtos devolveria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O appsettings.json é baixado pelo navegador a cada boot do app.
    # Sem no-store, um navegador pode continuar usando as URLs de uma
    # versão antiga da imagem depois de um redeploy.
    location = /appsettings.json {
        add_header Cache-Control "no-store";
    }
}
